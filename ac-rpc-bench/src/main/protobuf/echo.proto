syntax = "proto3";

package acrpc.bench;

option java_package = "com.ac.acrpc.bench.grpc";
option java_multiple_files = true;

// gRPC counterpart of EchoService, used as a comparison baseline.
service Echo {
  rpc Echo (EchoMessage) returns (EchoMessage);
}

message EchoMessage {
  bytes payload = 1;
}
